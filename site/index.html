<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f2e9" />
    <meta
      name="description"
      content="A small distributed logging engine with bounded ingestion, batched writes, and Go, C and Rust clients. Understand every step from source to storage."
    />
    <title>Aether-Log — A clear path for your logs.</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script>
      // Apply the saved/system theme before React paints.
      ;(() => {
        let saved
        try {
          saved = localStorage.getItem('aether-theme')
        } catch {}
        const theme =
          saved === 'light' || saved === 'dark'
            ? saved
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        document.documentElement.dataset.theme = theme
        document.querySelector('meta[name="theme-color"]').content =
          theme === 'dark' ? '#111b16' : '#f5f3ec'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
